# Le indica a Argo CD qué repo mirar y dónde desplegarlo.
# IMPORTANTE: reemplazar TU-USUARIO/TU-REPO por el repo real del grupo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Joacorodriguezz/ASI-2026-GRUPO-05.git
    targetRevision: main
    path: argo-demo/app
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true      # borra del clúster lo que se borra de Git
      selfHeal: true   # revierte cambios manuales hechos con kubectl
    syncOptions:
      - CreateNamespace=true
